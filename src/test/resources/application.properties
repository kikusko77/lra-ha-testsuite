quarkus.devservices.enabled=false
quarkus.http.test-port=9081
quarkus.http.test-host=0.0.0.0
quarkus.lra.coordinator-url=http://localhost:8080/lra-coordinator
quarkus.lra.base-uri=http://host.docker.internal:${quarkus.http.test-port}
lra.internal.client.retry.count=2
lra.internal.client.delay=200
lra.internal.client.delayUnit=MILLIS
lra.internal.client.maxDuration=0
lra.internal.client.durationUnit=MILLIS
lra.internal.client.jitter=0
lra.internal.client.jitterDelayUnit=MILLIS